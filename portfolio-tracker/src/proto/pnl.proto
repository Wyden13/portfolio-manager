syntax = "proto3";

package investiq.pnl.v1;

// One SSE event carries one PnLUpdate, serialized and base64-encoded in the `data:` field.
// Amounts are doubles for display; the server computes with exact decimals.
message PnLUpdate {
  int64 as_of_ms = 1;                    // server time, unix epoch milliseconds (UTC)
  repeated PositionPnL positions = 2;
  repeated CurrencyTotal totals = 3;
  // All totals converted to the server's base currency at spot FX. Unset when a rate was missing.
  CurrencyTotal base_total = 4;
  map<string, double> fx_rates = 5;      // base units per one unit of each currency
  repeated AccountSummary accounts = 6;  // empty when FX is not configured
  // Base-currency cash, and holdings plus cash, across all accounts. Unset when a rate was missing.
  optional double cash_base = 7;
  optional double total_assets_base = 8;
  string base_currency = 9;              // what base_total, accounts and the *_base fields are in; empty without FX
}

// One account in the base currency at spot FX.
message AccountSummary {
  int64 account_id = 1;
  double market_value = 2;               // holdings with a live price, cost basis or not
  double cost_basis = 3;                 // of the holdings that have one
  double unrealized_pnl = 4;
  optional double unrealized_pct = 5;    // unset when no holding has a cost basis
  repeated CashBalance cash = 6;
  double cash_value = 7;
  double total = 8;                      // market_value + cash_value
  int32 holdings = 9;
  bool complete = 10;                    // false when a currency had no FX rate and was left out
}

// Cash computed from the stored activity history, in its own currency.
message CashBalance {
  string currency = 1;
  double amount = 2;
  bool estimated = 3;                    // the stored history may not reach back to the account's opening
}

message PositionPnL {
  int64 account_id = 1;
  string symbol = 2;
  string currency = 3;
  double quantity = 4;
  double average_cost = 5;                // average_cost and cost_basis are 0 when status == STATUS_NO_COST
  double cost_basis = 6;
  // unrealized_pnl and unrealized_pct are only meaningful when status == STATUS_OK;
  // price and market_value also when status == STATUS_NO_COST.
  double price = 7;
  double market_value = 8;
  double unrealized_pnl = 9;
  double unrealized_pct = 10;
  int64 first_buy_ms = 11;               // 0 when unknown
  int64 quote_as_of_ms = 12;             // 0 when no quote
  Status status = 13;
  bool incomplete_history = 14;          // stored sells exceeded stored buys (so source is broker)
  Source source = 15;
  string asset_class = 16;               // stock | etf | fund | other
  optional double day_change_pct = 17;   // price vs the last session's close; unset without a quote or close
  optional int64 volume = 18;            // shares traded this session; unset without a quote
}

// Where quantity and cost come from: our stored transactions when they reproduce the broker's
// quantity, otherwise the broker's own position snapshot.
enum Source {
  SOURCE_TRANSACTIONS = 0;
  SOURCE_BROKER = 1;
}

enum Status {
  STATUS_OK = 0;
  STATUS_NO_QUOTE = 1;
  STATUS_CURRENCY_MISMATCH = 2;
  STATUS_NO_COST = 3;                    // priced, but the broker reported no cost basis
}

// Totals only include positions priced successfully, grouped by currency (no FX conversion).
message CurrencyTotal {
  string currency = 1;
  double cost_basis = 2;
  double market_value = 3;
  double unrealized_pnl = 4;
  double unrealized_pct = 5;
}
