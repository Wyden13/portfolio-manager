<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/mark.svg" color="#1A56DB" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C0E12" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Every account. One portfolio. Read-only view of your TFSA, RRSP, FHSA and brokerage accounts with market data and news." />
    <meta property="og:title" content="InvestIQ" />
    <meta property="og:description" content="TFSA, RRSP, FHSA and brokerage accounts with market data and news in one place." />
    <meta property="og:image" content="/og.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>InvestIQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the theme before first paint so dark-mode users don't see a light flash.
      try {
        var saved = localStorage.getItem('theme')
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
